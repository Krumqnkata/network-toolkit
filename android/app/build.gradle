import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native configuration. Defaults are used for everything except
 * autolinking; see the React Native docs for the available options.
 */
react {
    autolinkLibrariesWithApp()
}

/**
 * Versioning — package.json is the single source of truth.
 * versionName = package.json "version" (SemVer, e.g. 1.2.3 or 1.2.3-beta.1)
 * versionCode = major * 1_000_000 + minor * 1_000 + patch
 * The release workflow checks that the Git tag matches package.json.
 */
def packageJson = new JsonSlurper().parse(rootProject.file("../package.json"))
def appVersionName = packageJson.version as String
def semver = appVersionName =~ /^(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?$/
if (!semver.matches()) {
    throw new GradleException("package.json version '${appVersionName}' is not valid SemVer")
}
def (major, minor, patch) = [semver.group(1), semver.group(2), semver.group(3)].collect { it.toInteger() }
if (minor > 999 || patch > 999) {
    throw new GradleException("Minor and patch versions must be <= 999 to fit the versionCode scheme")
}
def appVersionCode = major * 1_000_000 + minor * 1_000 + patch

/**
 * Release signing. Credentials are never stored in the repository: they come
 * from environment variables (CI, populated from GitHub Actions secrets) or
 * from Gradle properties in ~/.gradle/gradle.properties (local builds).
 * Without them the release build is produced unsigned and cannot be installed.
 */
def signingValue = { String name -> System.getenv(name) ?: findProperty(name) }
def releaseStoreFile = signingValue("ANDROID_KEYSTORE_FILE")
def releaseSigningAvailable = releaseStoreFile &&
        signingValue("ANDROID_KEYSTORE_PASSWORD") &&
        signingValue("ANDROID_KEY_ALIAS") &&
        signingValue("ANDROID_KEY_PASSWORD")

/**
 * Set this to true to run R8 on release builds. Disabled until the native
 * modules have keep rules and release builds are covered by E2E tests.
 */
def enableProguardInReleaseBuilds = false

/**
 * JavaScriptCore flavor, used only when Hermes is disabled in gradle.properties.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "io.github.krumqnkata.networktoolkit"
    defaultConfig {
        applicationId "io.github.krumqnkata.networktoolkit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            // The well-known Android debug key. Never used for release builds.
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningAvailable) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue("ANDROID_KEYSTORE_PASSWORD")
                keyAlias signingValue("ANDROID_KEY_ALIAS")
                keyPassword signingValue("ANDROID_KEY_PASSWORD")
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    /**
     * Release builds also produce one APK per ABI (about a quarter of the
     * universal APK's size) next to the universal APK. All share the same
     * versionCode, which is fine for sideloading; the App Bundle is unaffected.
     * Debug builds keep a single APK.
     */
    def buildingRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
    splits {
        abi {
            enable buildingRelease
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        // Fails CI on errors such as NewApi (calling APIs above minSdk 26 without a check).
        abortOnError true
        htmlReport true
        xmlReport false
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    testImplementation("junit:junit:4.13.2")
}

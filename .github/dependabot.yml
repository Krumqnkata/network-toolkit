version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react-navigation:
        patterns: ['@react-navigation/*', 'react-native-screens', 'react-native-safe-area-context']
      testing:
        patterns: ['jest', '@types/jest', '@testing-library/*', 'test-renderer']
      lint-format:
        patterns: ['eslint*', 'prettier', 'typescript']
    ignore:
      # React Native minor releases change native template files and are
      # upgraded by hand with the React Native Upgrade Helper.
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@react-native-community/cli*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Tooling majors are tied to what the React Native presets support
      # (Babel 7, ESLint 8 legacy config, @react-native/typescript-config) and
      # are upgraded together with React Native.
      - dependency-name: '@babel/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Prettier majors reformat the codebase; upgraded manually in one commit.
      - dependency-name: 'prettier'
        update-types: ['version-update:semver-major']

  - package-ecosystem: gradle
    directory: /android
    ignore:
      # The Gradle wrapper version is pinned by the React Native template.
      - dependency-name: 'gradle-wrapper'
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

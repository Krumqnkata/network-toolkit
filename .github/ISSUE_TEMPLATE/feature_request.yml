name: Feature request
description: Suggest a new tool or an improvement
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to diagnose or achieve, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work in the app?
    validations:
      required: true
  - type: textarea
    id: android-constraints
    attributes:
      label: Android APIs or permissions involved
      description: If you know which Android APIs or permissions this needs, list them.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

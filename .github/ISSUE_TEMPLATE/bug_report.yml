name: Bug report
description: Something does not work as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please do **not** report
        security vulnerabilities here — see SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. See error …
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → About, or the release you installed (e.g. v0.1.0).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection type during the problem
      options:
        - Wi-Fi
        - Mobile data
        - Ethernet / other
        - No connection
        - Not relevant
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove IP addresses, SSIDs or other details you do not want to share publicly.
      render: shell

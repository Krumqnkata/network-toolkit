name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # AGPL-3.0-only is compatible with permissive and LGPL/GPLv3 licenses.
          deny-licenses: GPL-2.0-only, LGPL-2.1-only, SSPL-1.0, BUSL-1.1, CC-BY-NC-4.0

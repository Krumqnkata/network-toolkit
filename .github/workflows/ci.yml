name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the release workflow so a release runs exactly the same checks.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    name: TypeScript, lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Jest (unit + component tests) with coverage
        run: npm run test:coverage -- --ci

      # Debug builds load JS from Metro, so only a release bundle catches Babel
      # transform problems (e.g. syntax in dependencies) before a release.
      - name: Bundle release JavaScript
        run: >-
          npx react-native bundle --platform android --dev false --minify true
          --entry-file index.js --bundle-output "$RUNNER_TEMP/index.android.bundle"
          --assets-dest "$RUNNER_TEMP/assets"

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  android:
    name: Android build & Kotlin tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android NDK and CMake (with retries)
        run: bash .github/scripts/install-android-ndk.sh

      - name: Install dependencies
        run: npm ci

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Android lint (API levels, permissions, manifest)
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Assemble debug APK
        working-directory: android
        # Two ABIs keep CI fast; release builds include all of them.
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports-${{ github.sha }}
          path: android/app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload debug APK (not a release)
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

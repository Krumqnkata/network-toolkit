name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Check tag, package.json and CHANGELOG agree
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $SEMVER ]]; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit is not on main"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: CI checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & sign
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install Android NDK and CMake (with retries)
        run: bash .github/scripts/install-android-ndk.sh

      - name: Install dependencies
        run: npm ci

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK and App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify signatures
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK_DIR=android/app/build/outputs/apk/release
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"

          shopt -s nullglob
          APKS=("${APK_DIR}"/app-*-release.apk)
          # Universal APK plus one per ABI (see splits in android/app/build.gradle).
          if [[ ${#APKS[@]} -ne 5 ]]; then
            echo "::error::Expected 5 release APKs, found ${#APKS[@]}: ${APKS[*]}"
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            "${BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
            if grep -q "CN=Android Debug" apksigner.txt; then
              echo "::error::$APK is signed with the debug key"
              exit 1
            fi
            if [[ -n "${EXPECTED_CERT_SHA256}" ]]; then
              ACTUAL="$(grep -m1 'certificate SHA-256 digest' apksigner.txt | awk '{print $NF}')"
              EXPECTED="$(echo "${EXPECTED_CERT_SHA256}" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
              if [[ "$ACTUAL" != "$EXPECTED" ]]; then
                echo "::error::$APK: signing certificate $ACTUAL does not match the expected certificate"
                exit 1
              fi
            fi
          done

          jarsigner -verify "$AAB" | tee jarsigner.txt
          if ! grep -q "jar verified." jarsigner.txt; then
            echo "::error::App Bundle is not signed"
            exit 1
          fi

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir dist
          APK_DIR=android/app/build/outputs/apk/release
          cp "${APK_DIR}/app-universal-release.apk" "dist/NetworkToolkit-v${VERSION}.apk"
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "${APK_DIR}/app-${ABI}-release.apk" "dist/NetworkToolkit-v${VERSION}-${ABI}.apk"
          done
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/NetworkToolkit-v${VERSION}.aab"
          (cd dist && sha256sum NetworkToolkit-* > checksums.txt && cat checksums.txt)

          # Release notes = this version's CHANGELOG section.
          # Literal header match (versions contain regex metacharacters);
          # link reference definitions at the end of the file are skipped.
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]] || ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG section for ${VERSION} is empty"
            exit 1
          fi
          {
            echo ""
            echo "### Which file to download"
            echo ""
            echo "- \`NetworkToolkit-v${VERSION}-arm64-v8a.apk\` — almost every phone from the last years (smallest download)."
            echo "- \`NetworkToolkit-v${VERSION}-armeabi-v7a.apk\` — older 32-bit phones."
            echo "- \`NetworkToolkit-v${VERSION}.apk\` — universal, works on every device."
            echo "- \`-x86_64\` / \`-x86\` — emulators and Chromebooks; \`.aab\` is for app stores."
            echo ""
            echo "### Verify your download"
            echo ""
            echo '```'
            echo "sha256sum -c checksums.txt"
            echo '```'
          } >> release-notes.md
          cat release-notes.md

      - name: Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.validate.outputs.version }}
          path: |
            dist/
            release-notes.md
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.validate.outputs.version }}

      - name: Verify checksums
        run: cd dist && sha256sum -c checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then FLAGS+=(--prerelease); fi
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Network Toolkit v${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag \
            "${FLAGS[@]}"
